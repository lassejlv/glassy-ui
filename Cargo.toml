[package]
name = "glassy-ui"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Glassy UI components for native GPUI interfaces."
repository = "https://github.com/lassejlv/glassy-ui"
default-run = "glassy-gallery"

[[bin]]
name = "glassy-gallery"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["font-kit", "wayland", "x11"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
