[package]
name = "grafik-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Grafik components for native GPUI interfaces."
default-run = "grafik-gallery"

[[bin]]
name = "grafik-gallery"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "101ca00a1352ed71ef398f21b47836565d1998e3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "101ca00a1352ed71ef398f21b47836565d1998e3", features = [
    "font-kit",
    "wayland",
    "x11",
] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "101ca00a1352ed71ef398f21b47836565d1998e3", features = [
    "test-support",
] }
